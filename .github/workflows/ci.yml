name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y git-lfs
      - run: git lfs install --skip-repo
      - run: echo "127.0.0.1 forge.localhost" | sudo tee -a /etc/hosts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter forge-worker exec playwright install --with-deps chromium
      - run: pnpm run typecheck
      - run: pnpm test

  s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y git-lfs
      - run: git lfs install --skip-repo
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/versity/versitygw/cmd/versitygw@v1.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @git-forge/s3 test:s3

  libsql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: |
          curl -fsSLO https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.32/libsql-server-x86_64-unknown-linux-gnu.tar.xz
          echo "71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f  libsql-server-x86_64-unknown-linux-gnu.tar.xz" | sha256sum --check
          tar xf libsql-server-x86_64-unknown-linux-gnu.tar.xz
          echo "SQLD_BIN=$PWD/libsql-server-x86_64-unknown-linux-gnu/sqld" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @git-forge/libsql test
      - run: pnpm --filter @git-forge/accounts-node test:libsql
      - run: pnpm --filter forge-node exec vitest run test/unit/instance.test.ts

  node-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y git-lfs
      - run: git lfs install --skip-repo
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: sh apps/forge-node/build-executables.sh "$RUNNER_TEMP/node"
      - run: pnpm --filter forge-node test:e2e
        env:
          GIT_FORGE_NODE_BINARY: ${{ runner.temp }}/node/git-forge-node-linux-x64

name: Release CLI

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Compile single executables
        working-directory: packages/cli
        run: |
          mkdir -p dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            suffix=""
            if [ "$target" = "windows-x64" ]; then suffix=".exe"; fi
            bun build --compile --minify --target="bun-$target" src/main.ts --outfile "dist/git-forge-$target$suffix"
          done
          cd dist && sha256sum git-forge-* > SHA256SUMS
      - name: Smoke test
        run: packages/cli/dist/git-forge-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: git-forge-cli
          path: packages/cli/dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/cli/dist/* --title "git-forge CLI ${GITHUB_REF_NAME#cli-v}" --notes "Single-file executables of git-forge (git forge push). Verify with SHA256SUMS."

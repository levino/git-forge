name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [release/VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create on the selected commit, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(tr -d '[:space:]' < release/VERSION)"
          fi
          if [ "$GITHUB_REF_TYPE" != tag ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists already, nothing to do"
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  runner:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/git-forge-runner:${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/forge-worker/runner
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=git-forge CI runner (apps/forge-worker/runner)
      - id: image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'
          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare, runner]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - id: build
        run: echo "sha256=$(GIT_FORGE_VERSION=${TAG#v} sh release/build-release.sh "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build the git-forge CLI executables
        run: sh packages/cli/build-executables.sh "$RUNNER_TEMP/cli"
      - name: Build the git-forge-node executables
        run: sh apps/forge-node/build-executables.sh "$RUNNER_TEMP/node"
      - name: Build the Bunny Edge Script
        run: |
          GIT_FORGE_VERSION=${TAG#v} sh apps/forge-bunny/build.sh
          mkdir "$RUNNER_TEMP/bunny" && cp apps/forge-bunny/dist/edge.js "$RUNNER_TEMP/bunny/git-forge-bunny.js"
          (cd "$RUNNER_TEMP/bunny" && sha256sum git-forge-bunny.js >BUNNY-SHA256SUMS)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          RUNNER_IMAGE: ${{ needs.runner.outputs.image }}
        run: |
          version=${TAG#v}
          echo "$RUNNER_IMAGE" > "$RUNNER_TEMP/runner-image"
          command=$(sed -n -E "s/^command = \"V=[^ ]+ S=[0-9a-f]{64} /command = \"V=$version S=$SHA256 /p" templates/instance/wrangler.toml)
          if [ -z "$command" ]; then
            echo "templates/instance/wrangler.toml has no pinned build command" >&2
            exit 1
          fi
          {
            echo "Pin this release in your instance's \`wrangler.toml\` by setting \`V\` and \`S\` at the start of the \`[build]\` command:"
            echo
            echo '```sh'
            echo "V=$version S=$SHA256"
            echo '```'
            echo
            echo 'or replace the whole line with the build command of the [instance template](https://github.com/levino/git-forge/tree/main/templates/instance):'
            echo
            echo '```toml'
            echo '[build]'
            printf '%s\n' "$command"
            echo '```'
            echo
            echo '`S` is the SHA-256 of the `SHA256SUMS` asset, which lists the checksums of the Worker bundle and the migrations.'
            echo
            echo 'Instances with CI set the runner image in every `[[containers]]` entry (also in the `runner-image` asset):'
            echo
            echo '```toml'
            echo "image_vars = { RUNNER_IMAGE = \"$RUNNER_IMAGE\" }"
            echo '```'
            echo
            echo 'The `git-forge-<os>-<arch>` assets are single executables of the `git-forge` CLI (`git forge push`); `CLI-SHA256SUMS` lists their checksums.'
            echo
            echo 'The `git-forge-node-linux-<arch>` assets run an instance without Cloudflare (Raspberry Pi, any Linux server; see `apps/forge-node/README.md`); `NODE-SHA256SUMS` lists their checksums.'
            echo
            echo '`git-forge-bunny.js` is the Bunny Edge Script (see `apps/forge-bunny/README.md`); `BUNNY-SHA256SUMS` lists its checksum.'
          } > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          verify="--verify-tag"
          [ "$GITHUB_REF_TYPE" = tag ] || verify="--target $GITHUB_SHA"
          gh release create "$TAG" \
            "$RUNNER_TEMP/release/git-forge-worker.mjs" \
            "$RUNNER_TEMP/release/migrations.tar.gz" \
            "$RUNNER_TEMP/runner-image" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP"/cli/* \
            "$RUNNER_TEMP"/node/* \
            "$RUNNER_TEMP"/bunny/* \
            $verify --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $prerelease

  image:
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/git-forge-node"
          version=${TAG#v}
          tags="$image:$version"
          case "$version" in
            *-*) ;;
            *) tags="$tags,$image:${version%.*},$image:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/forge-node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=git-forge without Cloudflare (apps/forge-node)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pin-template:
    needs: [prepare, runner, release]
    if: ${{ !contains(needs.prepare.outputs.tag, '-') }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA256: ${{ needs.release.outputs.sha256 }}
      RUNNER_IMAGE: ${{ needs.runner.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin the release in templates/instance/wrangler.toml on main
        run: |
          version=${TAG#v}
          sed -i -E "s/^command = \"V=[^ ]+ S=[0-9a-f]{64} /command = \"V=$version S=$SHA256 /" templates/instance/wrangler.toml
          grep -q "^command = \"V=$version S=$SHA256 " templates/instance/wrangler.toml
          sed -i -E "s#ghcr\.io/[a-z0-9-]+/git-forge-runner:[^\"]+#$RUNNER_IMAGE#g" templates/instance/wrangler.toml templates/instance/README.md
          grep -q "RUNNER_IMAGE = \"$RUNNER_IMAGE\"" templates/instance/README.md
          if git diff --quiet; then
            echo "templates/instance already pins $TAG"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "chore: pin git-forge $version in the instance template"
          git push origin HEAD:main

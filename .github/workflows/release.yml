name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - id: build
        run: echo "sha256=$(sh release/build-release.sh "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            echo "Pin this release in your instance's \`git-forge.json\`:"
            echo
            echo '```json'
            printf '{\n  "version": "%s",\n  "sha256": "%s"\n}\n' "$version" "$SHA256"
            echo '```'
            echo
            echo '`sha256` is the SHA-256 of the `SHA256SUMS` asset, which lists the checksums of all other assets.'
          } > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/git-forge-worker.mjs" \
            "$RUNNER_TEMP/release/migrations.tar.gz" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $prerelease

  sync-template:
    needs: release
    uses: ./.github/workflows/sync-instance-template.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

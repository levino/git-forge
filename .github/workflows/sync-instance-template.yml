name: Sync instance template

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to pin, default: latest release'
        type: string
        required: false
  push:
    branches: [main]
    paths: ['templates/instance/**']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.INSTANCE_TEMPLATE_DEPLOY_KEY }}
      TARGET: levino/git-forge-instance
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the release to pin
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::INSTANCE_TEMPLATE_DEPLOY_KEY is not set; skipping the sync to $TARGET"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=${TAG:-$(gh release view --json tagName --jq .tagName 2>/dev/null || true)}
          if [ -z "$tag" ]; then
            echo "::notice::No release yet; skipping the sync to $TARGET"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Push templates/instance to the instance repository
        if: steps.release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone "git@github.com:$TARGET.git" "$RUNNER_TEMP/target"
          rsync -a --delete --exclude .git templates/instance/ "$RUNNER_TEMP/target/"
          printf '{\n  "version": "%s",\n  "sha256": "%s"\n}\n' "$VERSION" "$SHA256" > "$RUNNER_TEMP/target/git-forge.json"
          cd "$RUNNER_TEMP/target"
          git add -A
          if git diff --cached --quiet; then
            echo "$TARGET is up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: sync from levino/git-forge@${GITHUB_SHA::12}, pin git-forge $VERSION"
          git push origin HEAD:main

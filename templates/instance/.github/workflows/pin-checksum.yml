name: Pin checksum

on:
  pull_request:
    paths: [git-forge.json]

permissions:
  contents: write

jobs:
  pin:
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Write the sha256 of the release's SHA256SUMS into git-forge.json
        run: |
          version=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' git-forge.json)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS" "https://github.com/levino/git-forge/releases/download/v$version/SHA256SUMS"
          sum=$(sha256sum "$RUNNER_TEMP/SHA256SUMS" | cut -d' ' -f1)
          printf '{\n  "version": "%s",\n  "sha256": "%s"\n}\n' "$version" "$sum" > git-forge.json
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: pin sha256 of git-forge $version"
          git push

  verify:
    needs: pin
    if: always() && needs.pin.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pin.result == 'success' && github.head_ref || github.event.pull_request.head.sha }}
      - run: sh build.sh

name = "git-forge"
main = "dist/git-forge-worker.mjs"
no_bundle = true
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]
workers_dev = true

[build]
command = "V=0.9.2 S=26b118189767d5ac32416668b08496784e73b307c2209068a07e4860c03c7d47 && U=${GIT_FORGE_RELEASE_URL:-https://github.com/levino/git-forge/releases/download/v$V} && mkdir -p dist && cd dist && curl -fsSL -O $U/SHA256SUMS -O $U/git-forge-worker.mjs && echo \"$S  SHA256SUMS\" | sha256sum -c - && sha256sum -c --ignore-missing SHA256SUMS"

[limits]
cpu_ms = 60000

[placement]
mode = "smart"

[observability]
enabled = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "git-forge"

[[d1_databases]]
binding = "DB"
database_name = "git-forge"

[[queues.producers]]
binding = "IMPORTS"
queue = "git-forge-imports"

[[queues.producers]]
binding = "JOBS"
queue = "git-forge-jobs"

[[queues.consumers]]
queue = "git-forge-imports"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[[queues.consumers]]
queue = "git-forge-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 10

[triggers]
crons = ["17 3 * * *"]

[[send_email]]
name = "EMAIL"

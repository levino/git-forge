name = "git-forge"
main = "dist/git-forge-worker.mjs"
no_bundle = true
compatibility_date = "2026-10-01"
workers_dev = true

[build]
command = "V=0.8.4 S=f6a19ce16f9941e0e93277f5302bc7655b23610fbbf8a93daa0e325cb8ba1576 && U=${GIT_FORGE_RELEASE_URL:-https://github.com/levino/git-forge/releases/download/v$V} && mkdir -p dist && cd dist && curl -fsSL -O $U/SHA256SUMS -O $U/git-forge-worker.mjs && echo \"$S  SHA256SUMS\" | sha256sum -c - && sha256sum -c --ignore-missing SHA256SUMS"

[limits]
cpu_ms = 60000

[observability]
enabled = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "git-forge"

[[d1_databases]]
binding = "DB"
database_name = "git-forge"

[[queues.producers]]
binding = "IMPORTS"
queue = "git-forge-imports"

[[queues.producers]]
binding = "JOBS"
queue = "git-forge-jobs"

[[queues.consumers]]
queue = "git-forge-imports"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[[queues.consumers]]
queue = "git-forge-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 10

[triggers]
crons = ["17 3 * * *"]
